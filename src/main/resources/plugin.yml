name: RotateKasa
version: '${project.version}'
main: com.rotatesmp.kasa.KasaPlugin
api-version: '1.21'
author: RotateSMP
description: Anahtarla acilan, animasyonlu kasa (crate) sistemi

commands:
  kasakoy:
    description: Baktigin yere kasa (shulker) koyar ve envanterini icine doldurur
    usage: /kasakoy
    permission: rotatekasa.admin
  kasaanahtarver:
    description: Kasa anahtari verir
    usage: /kasaanahtarver <adet> [oyuncu]
    permission: rotatekasa.admin

  spawn:
    description: Spawn alanina isinlanirsin
    usage: /spawn
  setspawn:
    description: Spawn noktasini bulundugun yer yapar
    usage: /setspawn
    permission: rotatekasa.admin

  rtp:
    description: Rastgele bir yere isinlanirsin
    usage: /rtp
  artp:
    description: Dunya, Nether ve End secimli RTP menusunu acar
    usage: /artp
  rtpnpcolustur:
    description: Baktigin yere RTP menusu acan NPC olusturur
    usage: /rtpnpcolustur
    permission: rotatekasa.admin
  rtpnpcsil:
    description: Baktigin RTP NPC'sini siler
    usage: /rtpnpcsil
    permission: rotatekasa.admin

permissions:
  rotatekasa.admin:
    description: Kasa koyma, kaldirma, duzenleme ve anahtar verme
    default: op
